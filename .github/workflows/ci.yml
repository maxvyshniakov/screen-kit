name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg webp agg

      - name: Install system tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg webp python3
          sudo apt-get install -y \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 || \
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2
          AGG_VERSION="v1.9.0"
          case "$(uname -m)" in
            x86_64)
              AGG_ASSET="agg-x86_64-unknown-linux-gnu"
              AGG_SHA256="f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6"
              ;;
            aarch64|arm64)
              AGG_ASSET="agg-aarch64-unknown-linux-gnu"
              AGG_SHA256="2b4be407b97e00e1c313a41d154ced8fa3d02c560c8f47a0db4950a2576444c9"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://github.com/asciinema/agg/releases/download/${AGG_VERSION}/${AGG_ASSET}" -o /tmp/agg
          echo "${AGG_SHA256}  /tmp/agg" | sha256sum -c -
          chmod +x /tmp/agg
          sudo mv /tmp/agg /usr/local/bin/agg

      - name: Verify system tools
        run: |
          python3 --version
          agg --version
          ffmpeg -version | head -n 1
          gif2webp -version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        run: bun run verify
