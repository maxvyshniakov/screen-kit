name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macos-latest provides python3 out of the box and installs ffmpeg, webp (gif2webp),
    # and agg (>= 1.9) cleanly via Homebrew without custom binary downloads.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system tools
        run: |
          brew install ffmpeg webp agg
          python3 --version
          agg --version
          ffmpeg -version | head -n 1
          gif2webp -version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify
