# Publishes screen-kit to npmjs.org with npm trusted publishing
# (OIDC) and provenance.
#
# - Register this file once on npmjs.org as the package's trusted publisher:
#   npm trust github screen-kit --file release-npm.yml --repo maxvyshniakov/screen-kit
#   (In the web UI, enable "Allow npm publish" under Allowed actions and run
#   this workflow once to validate the connection.)
# - Release: cut the version (`bun run release <patch|minor|major>`), push main,
#   then `gh workflow run release-npm.yml --repo maxvyshniakov/screen-kit --ref main`.
name: Release to npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: maxvyshniakov/package-kit/actions/setup-bun@v1.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 fonts-noto-color-emoji
          sudo apt-get install -y \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 || \
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2

      - name: Verify
        run: bun run verify -- --release

  publish:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: maxvyshniakov/package-kit/actions/setup-bun@v1.0.1
      - uses: maxvyshniakov/package-kit/actions/npm-publish@v1.0.1
